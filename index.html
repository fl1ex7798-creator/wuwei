<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Your Resume</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7fbfa;color:#080818;font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}.page{min-height:100vh;max-width:1440px;margin:auto;display:grid;grid-template-columns:45% 55%;padding:72px 56px 36px 74px;gap:0}.intro{position:relative;min-height:642px;padding-top:17px;overflow:hidden}.intro h1{font-size:29px;line-height:1.32;font-weight:400;color:#090b0c;margin:0 0 16px}.intro p{font-size:14px;line-height:25px;color:#a3a6a6;max-width:475px;margin:0;padding-right:24px}.illustration{position:absolute;width:470px;height:425px;bottom:-37px;left:-38px}.card{background:#fff;border-radius:24px;box-shadow:0 2px 15px #173a4b1c;min-height:642px;padding:18px 13.6% 60px;display:flex;flex-direction:column}.card h2{font-size:27px;letter-spacing:2px;font-weight:500;margin:0 0 32px;line-height:32px}.dropzone{height:293px;flex-shrink:0;position:relative;border:1px dashed #7396ff;border-radius:13px;background:#f2faff;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}.dropzone:hover,.dropzone.dragging{background:#e8f3ff;border-color:#2258ff}.dropzone:focus-within{outline:3px solid #a9bfff;outline-offset:4px}.dropzone input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.upload-icon{width:42px;height:35px;color:#204de8;margin:7px 0 13px}.hint{font-size:12px;line-height:23px;color:#a2a7aa;margin:0;max-width:350px}.filename{font-size:13px;color:#2455ef;margin:10px 0 0;max-width:100%;overflow-wrap:anywhere}.filename:empty{display:none}.actions{display:flex;gap:20px;margin:68px 39px 0}.button{height:47px;border:0;border-radius:5px;background:#2058ff;color:white;letter-spacing:2px;font-size:17px;cursor:pointer;flex:1;white-space:nowrap;transition:background .2s,transform .15s,box-shadow .2s}.button.secondary{background:#77a8ff}.button:hover{background:#1546dd;box-shadow:0 5px 13px #2455ff25}.button.secondary:hover{background:#5c94f5}.button:active{transform:translateY(2px)}.button:focus-visible{outline:3px solid #a9bfff;outline-offset:4px}.steps{display:flex;align-items:center;justify-content:space-between;position:relative;width:240px;margin:70px auto 0;padding:0 19px;list-style:none}.steps:before{content:"";height:3px;position:absolute;left:0;right:0;background:linear-gradient(to right,#88a5ff 88%,#dce0e9 88%);border-radius:4px}.steps li{position:relative;display:grid;place-items:center;background:#91a9ff;border:2px solid #3157ff;border-radius:50%;width:23px;height:23px;font-size:9px;color:#fff}.steps svg{width:10px;height:10px;color:#3157ff}.status{text-align:center;color:#42608f;font-size:13px;line-height:20px;margin:15px 0 -35px;min-height:20px}.status:empty{visibility:hidden}@media(min-width:1450px){.page{padding-top:9vh}}@media(max-width:1000px){.page{padding:44px 30px;grid-template-columns:43% 57%}.card{padding-left:9%;padding-right:9%}.intro h1{font-size:26px}.illustration{width:390px;left:-60px}.actions{margin-left:0;margin-right:0}}@media(max-width:700px){.page{display:flex;flex-direction:column;padding:28px 20px;gap:28px}.intro{min-height:auto;padding:0}.intro h1{font-size:27px}.intro p{max-width:450px}.illustration{display:none}.card{min-height:550px;padding:26px 24px 35px;border-radius:20px}.card h2{font-size:24px;margin-bottom:26px}.dropzone{height:255px;padding:20px}.actions{margin-top:35px;gap:14px}.button{font-size:15px}.steps{margin-top:42px;width:220px}.status{margin-bottom:-20px}}
</style>
</head>
<body>
<main class="page">
<section class="intro" aria-labelledby="page-title">
<h1 id="page-title">Finish!<br>Upload Your Resume</h1>
<p>Upload your resume, the platform will help you parse and optimize, you can also skip this step</p>

<ellipse cx="199" cy="291" rx="10" ry="12" fill="#fff"/><ellipse cx="232" cy="291" rx="10" ry="12" fill="#fff"/><ellipse cx="203" cy="288" rx="3" ry="5" fill="#172a45" stroke="none"/><ellipse cx="236" cy="288" rx="3" ry="5" fill="#172a45" stroke="none"/><path d="M215 304L218 307L221 303Z" fill="#253445"/><path d="M207 307L161 298M207 312L159 312M226 308L274 290M227 313L276 308"/>
</g></svg>
</section>
<section class="card" aria-labelledby="upload-title">
<h2 id="upload-title">Upload file</h2>
<label class="dropzone" id="dropzone">
<input id="resume" type="file" accept=".pdf,.doc,.docx,.txt" aria-label="Upload resume">
<svg class="upload-icon" viewBox="0 0 42 35" fill="none" aria-hidden="true"><path d="M12 29H31C42 29 41 16 32 16C30 4 15 1 10 13C-1 13-1 29 12 29Z" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 24V14M16.5 18.5L21 14L25.5 18.5" stroke="currentColor" stroke-width="3.5"/></svg>
<p class="hint">Drag your resume file to this area, or click on the area to select<br class="desktop-break"> the appropriate file to upload</p>
<p class="filename" id="filename" aria-live="polite"></p>
</label>
<div class="actions"><button class="button secondary" id="back" type="button">Last step</button><button class="button" id="finish" type="button">Finish</button></div>
<ol class="steps" aria-label="Step 3 of 3"><li aria-label="Step 1 complete"><svg viewBox="0 0 12 12"><path d="m2 6 3 3 5-6" fill="none" stroke="currentColor"/></svg></li><li aria-label="Step 2 complete"><svg viewBox="0 0 12 12"><path d="m2 6 3 3 5-6" fill="none" stroke="currentColor"/></svg></li><li aria-current="step">3</li></ol>
<p class="status" id="status" role="status"></p>
</section>
</main>
<script>
const input=document.getElementById('resume'),zone=document.getElementById('dropzone'),filename=document.getElementById('filename'),status=document.getElementById('status');let selectedFile=null;
function selectFile(file){if(!file)return;if(!/\.(pdf|docx?|txt)$/i.test(file.name)){status.textContent='Please select a PDF, Word, or TXT file.';return;}selectedFile=file;filename.textContent=file.name;status.textContent='';}
input.addEventListener('change',()=>selectFile(input.files[0]));
['dragenter','dragover'].forEach(event=>zone.addEventListener(event,e=>{e.preventDefault();zone.classList.add('dragging');}));
['dragleave','drop'].forEach(event=>zone.addEventListener(event,e=>{e.preventDefault();zone.classList.remove('dragging');}));
zone.addEventListener('drop',e=>selectFile(e.dataTransfer.files[0]));
document.getElementById('finish').addEventListener('click',()=>{status.textContent=selectedFile?'All set! Your resume has been selected.':'All set! You have skipped the resume step.';});
document.getElementById('back').addEventListener('click',()=>{status.textContent='This is a standalone preview of the final step.';});
</script>
</body>
</html>
